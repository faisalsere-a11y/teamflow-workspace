<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TeamFlow Workspace</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="welcome-screen" id="loginScreen" aria-label="Login">
      <div class="welcome-inner login-inner">
        <p class="eyebrow">TeamFlow Workspace</p>
        <h1>Secure role workspace</h1>
        <p class="welcome-copy">Use a demo account to preview JWT-style auth, RBAC, task routing, notifications, feedback, and analytics locally.</p>

        <form class="login-panel" id="loginForm" method="post" action="/" onsubmit="return false">
          <label>
            Email
            <input id="loginEmail" name="email" type="email" value="supervisor@teamflow.local" autocomplete="email" />
          </label>
          <label>
            Password
            <input id="loginPassword" name="password" type="password" value="demo12345" autocomplete="current-password" />
          </label>
          <p class="password-note">Demo password: <strong>demo12345</strong></p>
          <div class="login-actions">
            <button class="primary-button" type="submit">Sign in</button>
            <button class="secondary-button" type="button" data-action="openCreateProfileModal">Create profile</button>
          </div>
        </form>

        <div class="demo-account-grid" id="demoAccounts" aria-label="Demo accounts"></div>
      </div>
    </section>

    <div class="app-shell" id="appShell" hidden>
      <aside class="sidebar" aria-label="Workspace navigation">
        <div class="brand-block">
          <img src="assets/pdf-images/pdf-image-1.jpg" alt="CCIS logo" class="brand-logo" />
          <div>
            <p class="eyebrow">Internal PM</p>
            <h1>TeamFlow Workspace</h1>
          </div>
        </div>

        <nav class="nav-list" id="navList" aria-label="Sections"></nav>

        <div class="sidebar-footer">
          <span class="status-dot"></span>
          <span id="activeRoleLabel">Logged out</span>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">Protected demo route</p>
            <h2 id="activeUserName">Workspace</h2>
          </div>
          <div class="topbar-actions">
            <button class="ghost-button notification-trigger" id="notificationToggle" aria-expanded="false">
              Notifications <span id="notificationCount">0</span>
            </button>
            <button class="ghost-button" id="themeToggle">Dark Mode</button>
            <button class="ghost-button" id="resetDemo">Reset Demo</button>
            <button class="ghost-button" id="logoutButton">Log Out</button>
          </div>
          <div class="notification-popover" id="notificationPopover" hidden></div>
        </header>

        <section class="section is-visible" id="dashboard">
          <div id="dashboardView"></div>
        </section>

        <section class="section" id="teams">
          <div id="teamsView"></div>
        </section>

        <section class="section" id="tasks">
          <div id="tasksView"></div>
        </section>

        <section class="section" id="notifications">
          <div id="notificationsView"></div>
        </section>

        <section class="section" id="analytics">
          <div id="analyticsView"></div>
        </section>

        <section class="activity-strip" aria-live="polite">
          <h3>Audit log</h3>
          <ol id="activityLog"></ol>
        </section>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
          <h3 id="modalTitle"></h3>
          <button class="icon-button" id="closeModal" aria-label="Close modal">x</button>
        </div>
        <div id="modalBody"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
